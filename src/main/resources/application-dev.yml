logging:
  level:
    root: debug
    org:
      hibernate:
        orm:
          jdbc:
            bind: trace
      springframework:
        transaction:
          interceptor: trace

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_DEV_HOST}:3306/caboomlog
    username: root
    password: ${MYSQL_DEV_PWD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show-sql: true
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.MySQL8Dialect
    data:
      redis:
        host: localhost
        port: 6379
        password: ${REDIS_DEV_PWD}
  mail:
    username:
    password:

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://admin:admin@localhost:8761/eureka